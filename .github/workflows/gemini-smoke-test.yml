name: Gemini API Smoke Test

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Gemini model to test"
        required: true
        type: choice
        options:
          - gemini-3.5-flash-lite
          - gemini-3.8-flash
        default: gemini-3.5-flash-lite

permissions:
  contents: read

concurrency:
  group: gemini-smoke-test
  cancel-in-progress: false

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Gemini SDK
        run: python -m pip install --disable-pip-version-check "google-genai>=1.0,<2"

      - name: Test Gemini API and JSON response
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.model }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from google import genai
          from google.genai import types

          api_key = os.environ.get("GEMINI_API_KEY")
          model = os.environ["GEMINI_MODEL"]
          if not api_key:
              print("::error::Missing GEMINI_API_KEY repository secret.")
              sys.exit(1)

          client = genai.Client(
              api_key=api_key,
              http_options=types.HttpOptions(
                  timeout=60_000,
                  retry_options=types.HttpRetryOptions(attempts=1),
              ),
          )
          try:
              response = client.models.generate_content(
                  model=model,
                  contents='Return exactly this JSON object: {"status":"ok"}',
                  config=types.GenerateContentConfig(
                      max_output_tokens=128,
                      response_mime_type="application/json",
                      response_schema={
                          "type": "OBJECT",
                          "properties": {"status": {"type": "STRING"}},
                          "required": ["status"],
                      },
                  ),
              )
              text = response.text or ""
              parsed = json.loads(text)
              if parsed.get("status") != "ok":
                  raise ValueError("JSON response did not contain status=ok")
              print(f"Model: {model}")
              print("API request: successful")
              print("JSON response: valid")
          except Exception as exc:
              print(f"::error::Gemini smoke test failed: {type(exc).__name__}: {exc}")
              raise
          finally:
              client.close()
          PY
