name: Gemini Free AI Coding Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "งานที่ต้องการให้ AI Agent ทำ (ห้ามใส่ secret หรือข้อมูลลับ)"
        required: true
        type: string

permissions: {}

concurrency:
  group: gemini-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  agent:
    if: github.ref == 'refs/heads/main'
    outputs:
      has_changes: ${{ steps.validate.outputs.has_changes }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install trusted project dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt

      - name: Generate changes with Gemini Free Tier
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGENT_TASK: ${{ inputs.task }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Missing GEMINI_API_KEY GitHub Actions secret."
            exit 1
          fi
          python scripts/ai_agent.py

      - name: Validate generated changes
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          ruff check scripts tests
          python -m compileall -q scripts tests
          pytest -q
          git add -N -- scripts/ tests/ docs/ README.md pyproject.toml requirements.txt requirements-dev.txt
          git diff --check HEAD
          if ! git diff --diff-filter=D --quiet HEAD; then
            echo "::error::Agent-generated file deletions are not allowed."
            exit 1
          fi
          while IFS= read -r -d '' path; do
            case "$path" in
              scripts/*|tests/*|docs/*|README.md|pyproject.toml|requirements.txt|requirements-dev.txt) ;;
              *) echo "::error::Rejected path: $path"; exit 1 ;;
            esac
            if [ "$path" = "scripts/ai_agent.py" ]; then
              echo "::error::Agent policy file is protected."
              exit 1
            fi
            check="$path"
            while [ "$check" != "." ]; do
              if [ -L "$check" ]; then
                echo "::error::Symbolic links are not allowed: $check"
                exit 1
              fi
              check="$(dirname "$check")"
            done
          done < <(git diff --name-only -z HEAD)
          if git diff --quiet HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git diff --binary HEAD > /tmp/agent.patch
          fi

      - name: Upload validated patch
        if: steps.validate.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gemini-agent-patch
          path: /tmp/agent.patch
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: agent
    if: needs.agent.result == 'success' && needs.agent.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout clean main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Download validated patch
        uses: actions/download-artifact@v4
        with:
          name: gemini-agent-patch
          path: /tmp/agent-artifact

      - name: Apply patch without executing generated code
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/agent-artifact/agent.patch
          git apply --check /tmp/agent-artifact/agent.patch
          git apply /tmp/agent-artifact/agent.patch
          git diff --check
          if ! git diff --diff-filter=D --quiet; then
            echo "::error::Patch contains file deletions."
            exit 1
          fi
          while IFS= read -r -d '' path; do
            case "$path" in
              scripts/*|tests/*|docs/*|README.md|pyproject.toml|requirements.txt|requirements-dev.txt) ;;
              *) echo "::error::Rejected patch path: $path"; exit 1 ;;
            esac
            if [ "$path" = "scripts/ai_agent.py" ]; then
              echo "::error::Patch attempts to modify protected agent policy."
              exit 1
            fi
            check="$path"
            while [ "$check" != "." ]; do
              if [ -L "$check" ]; then
                echo "::error::Patch contains symbolic link: $check"
                exit 1
              fi
              check="$(dirname "$check")"
            done
          done < <(git diff --name-only -z)
          git add -A -- scripts/ tests/ docs/ README.md pyproject.toml requirements.txt requirements-dev.txt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "::error::Patch produced no changes."
            exit 1
          fi

      - name: Create branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          AGENT_TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          branch="ai-agent/run-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "feat: AI agent task changes"
          gh auth setup-git
          git push origin "$branch"
          printf "Generated by Gemini Free Tier in GitHub Actions.\n\nTask:\n%s\n\n- Generated and tested in a read-only job.\n- Published from a clean runner without executing generated code.\n- No Master workbook or production DB access.\n- Human review and merge required.\n" "$AGENT_TASK" > /tmp/pr-body.md
          gh pr create \
            --base main \
            --head "$branch" \
            --title "AI Agent task run $RUN_ID" \
            --body-file /tmp/pr-body.md
