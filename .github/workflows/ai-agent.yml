name: Gemini Free AI Coding Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "งานที่ต้องการให้ AI Agent ทำ (ห้ามใส่ secret หรือข้อมูลลับ)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gemini-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coding-agent:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate changes with Gemini Free Tier
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGENT_TASK: ${{ inputs.task }}
          GEMINI_MODEL: gemini-3.8-flash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Missing GEMINI_API_KEY GitHub Actions secret."
            exit 1
          fi
          python scripts/ai_agent.py

      - name: Install project dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt

      - name: Validate generated changes
        run: |
          git diff --check
          ruff check scripts tests
          python -m compileall -q scripts tests
          pytest -q

      - name: Create isolated branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          AGENT_TASK: ${{ inputs.task }}
        run: |
          if git diff --quiet; then
            echo "Agent produced no file changes; no PR created."
            exit 0
          fi
          branch="ai-agent/run-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "feat: AI agent task changes"
          git push origin "$branch"
          printf "Generated by Gemini Free Tier in GitHub Actions.\n\nTask:\n%s\n\n- CI and tests ran before PR creation.\n- No Master workbook or production DB access.\n- Human review and merge required.\n" "$AGENT_TASK" > pr-body.md
          gh pr create \
            --base main \
            --head "$branch" \
            --title "AI Agent task run $RUN_ID" \
            --body-file pr-body.md
